name: 大宗商品每日信息采集

on:
  schedule:
    # 每天北京时间 05:00 运行（UTC 21:00）
    - cron: '0 21 * * *'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: shu-signal-daily-publication
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      DAILY_BASE_TOKEN: ${{ secrets.DAILY_BASE_TOKEN }}
      DAILY_TABLE_ID: ${{ secrets.DAILY_TABLE_ID }}
      INFO_BASE_TOKEN: ${{ secrets.INFO_BASE_TOKEN }}
      INFO_TABLE_ID: ${{ secrets.INFO_TABLE_ID }}
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      MONITORING_FEISHU_WEBHOOK_URL: ${{ secrets.MONITORING_FEISHU_WEBHOOK_URL }}
      BAIDU_TRANSLATE_APPID: ${{ secrets.BAIDU_TRANSLATE_APPID }}
      BAIDU_TRANSLATE_KEY: ${{ secrets.BAIDU_TRANSLATE_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: deepseek-chat
      MODEL_INPUT_COST_PER_MILLION: ${{ vars.MODEL_INPUT_COST_PER_MILLION }}
      MODEL_OUTPUT_COST_PER_MILLION: ${{ vars.MODEL_OUTPUT_COST_PER_MILLION }}
      SKILL_ENVIRONMENT: production
      SKILL_VERSION: '1.5'
      SHU_SIGNAL_SITE_URL: ${{ vars.SHU_SIGNAL_SITE_URL || 'https://shu-signal-intelligence.yuntingnian834.chatgpt.site' }}
      FRESHNESS_REPORT_DIR: data/monitoring/freshness
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: 设置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt
        timeout-minutes: 5

      - name: 采集、推送并生成网站快照
        run: python scripts/runtime/daily_pipeline.py --result pipeline-result.json
        timeout-minutes: 65

      - name: 保存运行监控数据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-monitoring-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/monitoring.sqlite3*
            data/monitoring/
          if-no-files-found: ignore
          retention-days: 30

      - name: 保存当日网站数据快照
        run: |
          git config user.name "shu-signal-bot"
          git config user.email "shu-signal-bot@users.noreply.github.com"
          git add showcase/shu-signal-data.js
          if git diff --cached --quiet; then
            echo "网站快照无变化，无需提交"
          else
            git commit -m "data: refresh SHU SIGNAL daily snapshot"
            git push
          fi

      - name: 预热并核对Sites当日数据
        continue-on-error: true
        run: python scripts/monitoring/phase5/freshness_monitor.py --refresh --pipeline-result pipeline-result.json --notification-mode alerts-only

      - name: 保存网站新鲜度报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-freshness-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/monitoring/freshness/
          if-no-files-found: ignore
          retention-days: 90

      - name: 组装网站发布文件
        run: |
          mkdir -p pages-dist
          cp showcase/shu-signal-draft.html pages-dist/index.html
          cp showcase/shu-signal-draft.html pages-dist/shu-signal-draft.html
          cp showcase/intelligence.html pages-dist/intelligence.html
          cp showcase/intelligence-detail.html pages-dist/intelligence-detail.html
          cp showcase/event-timeline.html pages-dist/event-timeline.html
          cp showcase/daily-brief.html pages-dist/daily-brief.html
          cp showcase/monitoring-dashboard.html pages-dist/monitoring-dashboard.html
          cp showcase/monitoring-dashboard.js pages-dist/monitoring-dashboard.js
          cp showcase/analytics.js pages-dist/analytics.js
          cp showcase/shu-signal-pages.css pages-dist/shu-signal-pages.css
          cp showcase/shu-signal-data.js pages-dist/shu-signal-data.js

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传网站文件
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-dist

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布网站
        id: deployment
        uses: actions/deploy-pages@v4
