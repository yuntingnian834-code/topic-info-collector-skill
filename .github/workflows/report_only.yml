name: 日报推送测试（仅飞书卡片）

on:
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt
        timeout-minutes: 3

      - name: 写入环境变量
        run: |
          cat > .env << EOF
          FEISHU_APP_ID=${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET=${{ secrets.FEISHU_APP_SECRET }}
          DAILY_BASE_TOKEN=${{ secrets.DAILY_BASE_TOKEN }}
          DAILY_TABLE_ID=${{ secrets.DAILY_TABLE_ID }}
          INFO_BASE_TOKEN=${{ secrets.INFO_BASE_TOKEN }}
          INFO_TABLE_ID=${{ secrets.INFO_TABLE_ID }}
          FEISHU_WEBHOOK_URL=${{ secrets.FEISHU_WEBHOOK_URL }}
          BAIDU_TRANSLATE_APPID=${{ secrets.BAIDU_TRANSLATE_APPID }}
          BAIDU_TRANSLATE_KEY=${{ secrets.BAIDU_TRANSLATE_KEY }}
          DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
          EOF

      - name: 推送飞书日报
        run: python scripts/reporter.py
        timeout-minutes: 2
